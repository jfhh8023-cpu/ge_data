server {
    listen 80;
    server_name jfzhu8023.cloud 43.138.150.37 localhost "";

    client_max_body_size 200M;

    # BEGIN_DEVTRACKER
    # ===================== DevTracker =====================
    location = /devtracker {
        return 301 /devtracker/$is_args$args;
    }

    location ^~ /devtracker/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location ^~ /devtracker/ {
        alias /opt/devtracker/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /devtracker/index.html;
    }
    # END_DEVTRACKER

    # ========== Notification System (保留原配置) ==========
    location / {
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE Stream settings
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
    }
}
