# DevTracker Nginx location block
# Add this inside every server block that serves jfzhu8023.cloud (HTTP and HTTPS).
# Place BEFORE the catch-all "location /" block.

    # BEGIN_DEVTRACKER
    # ===================== DevTracker =====================
    location = /devtracker {
        return 301 /devtracker/$is_args$args;
    }

    location ^~ /devtracker/api/local-reports/workload-analysis/ {
        proxy_pass http://127.0.0.1:3001/api/local-reports/workload-analysis/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ^~ /devtracker/api/local-reports/ {
        alias /opt/devtracker/.codex-local/reports/;
        try_files $uri =404;
        gzip on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ^~ /devtracker/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /devtracker/assets/ {
        alias /opt/devtracker/frontend/dist/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /devtracker/ {
        alias /opt/devtracker/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /devtracker/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    # END_DEVTRACKER
