server {
    listen 8088;
    server_name 192.168.17.133;
    client_max_body_size 20m;

    location = / {
        return 302 /devtracker/;
    }

    location = /devtracker {
        return 301 /devtracker/$is_args$args;
    }

    location ^~ /devtracker/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /devtracker/assets/ {
        alias /opt/devtracker/frontend/dist/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /devtracker/ {
        alias /opt/devtracker/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /devtracker/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
